name: Recovery verification
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  recovery:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Build application
        run: docker build -t order-stock-recovery .
      - name: Verify restart, DB outage, overdue orders and five-minute checkout recovery
        run: python3 scripts/verify-resilience.py --disposable --image order-stock-recovery --duration-seconds 300 --output recovery-report.json
      - name: Upload aggregate recovery report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: recovery-report
          path: recovery-report.json
          if-no-files-found: error
          retention-days: 7
