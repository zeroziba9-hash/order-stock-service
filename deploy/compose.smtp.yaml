# Optional production mail. Use only with compose.prod.yaml and a private environment file.
services:
  app:
    environment:
      APP_PASSWORD_RESET_ENABLED: "true"
      APP_PASSWORD_RESET_BASE_URL: https://${APP_DOMAIN:?Set APP_DOMAIN}
      APP_PASSWORD_RESET_FROM: ${RESET_MAIL_FROM:?Set a verified sender}
      SPRING_MAIL_HOST: ${SMTP_HOST:?Set SMTP_HOST}
      SPRING_MAIL_PORT: ${SMTP_PORT:-587}
      SPRING_MAIL_USERNAME: ${SMTP_USERNAME:?Set SMTP_USERNAME}
      SPRING_MAIL_PASSWORD: ${SMTP_PASSWORD:?Set SMTP_PASSWORD}
      SPRING_MAIL_PROPERTIES_MAIL_SMTP_AUTH: "true"
      SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_ENABLE: "true"
      SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_REQUIRED: "true"
