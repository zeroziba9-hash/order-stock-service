# A dedicated account can access only order_stock_test, never the development DB.
spring.config.import=optional:file:.local/mysql/spring-test.properties
app.mock-payments.enabled=true
app.mock-refunds.enabled=true
app.orders.expiration.enabled=false
# Other integration suites create many auth fixtures; the dedicated limiter suite enables real limits.
app.auth.limits.enabled=false
# MockMvc suites explicitly connect MockHttpSession fixtures. Real JDBC-session tests override this exclusion.
spring.autoconfigure.exclude=org.springframework.boot.session.jdbc.autoconfigure.JdbcSessionAutoConfiguration
