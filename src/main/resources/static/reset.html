<!doctype html>
<html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>비밀번호 복구 — STOCKROOM</title><link rel="icon" href="/assets/favicon.svg"><link rel="stylesheet" href="/assets/store.css"><script src="/assets/accessibility.js" defer></script><script src="/assets/reset.js" defer></script></head>
<body><a class="skip-link" href="#main" tabindex="0">본문으로 건너뛰기</a><header class="header"><a class="brand" href="/">STOCKROOM®</a><a class="text-link" href="/">컬렉션으로 돌아가기 ↗</a></header><main tabindex="-1" id="main" class="reset-main"><p class="eyebrow">ACCOUNT RECOVERY</p><h1 id="reset-title">계정을 다시 만나세요.</h1><p class="muted" id="reset-description">가입한 이메일로 비밀번호 재설정 링크를 요청하세요.</p><p id="reset-status" role="status" class="field-help"></p>
<form id="reset-request"><label for="reset-email">가입한 이메일</label><input id="reset-email" type="email" maxlength="254" autocomplete="username" required><button id="reset-request-submit" class="button primary full" disabled>재설정 메일 요청</button><p class="field-help">메일은 1분에 한 번, 계정당 시간당 최대 5회 요청할 수 있어요. 직접 요청하지 않은 메일은 무시하세요.</p></form>
<form id="reset-confirm" hidden><label for="reset-password">새 비밀번호</label><input id="reset-password" type="password" minlength="8" maxlength="72" autocomplete="new-password" required><label for="reset-password-again">새 비밀번호 확인</label><input id="reset-password-again" type="password" minlength="8" maxlength="72" autocomplete="new-password" required><p class="field-help">8자 이상, UTF-8 기준 72바이트 이하로 입력하세요. 변경하면 모든 기기의 기존 접속이 종료돼요.</p><button id="reset-confirm-submit" class="button primary full">새 비밀번호로 변경</button><a href="/reset.html" class="text-link">재설정 메일 다시 요청 →</a></form>
<p id="reset-error" class="form-error" role="alert"></p><p><a href="/#account" class="text-link">로그인 화면으로 돌아가기 →</a></p></main></body></html>
