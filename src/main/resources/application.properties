spring.application.name=order-stock-service
# Correlate application logs with the server-generated response header. No ID outside a request.
logging.pattern.level=%5p [requestId=%X{requestId:-}]
spring.profiles.default=local
server.port=${PORT:8080}
server.address=127.0.0.1
server.forward-headers-strategy=none
management.endpoints.web.exposure.include=health

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
# LocalDateTime represents UTC wall-clock values; JDBC 4.2 avoids JVM-zone Timestamp conversion.
spring.jpa.properties.hibernate.type.java_time_use_direct_jdbc=true
spring.flyway.enabled=true
# Reject fractional quantities instead of silently truncating them to integers.
spring.jackson.deserialization.accept-float-as-int=false
spring.jackson.datatype.enum.fail-on-numbers-for-enums=true
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.timeout=30m
spring.session.jdbc.initialize-schema=never
spring.session.jdbc.table-name=app_sessions
spring.session.jdbc.cleanup-cron=0 * * * * *

# Mutating mock endpoints are enabled only in explicitly configured learning/test environments.
app.mock-payments.enabled=false
app.mock-refunds.enabled=false
spring.servlet.multipart.max-file-size=3MB
spring.servlet.multipart.max-request-size=4MB
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
