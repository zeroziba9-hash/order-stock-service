# Local captured mail only. No SMTP host port, relay, external delivery or production credentials.
services:
  mailpit:
    image: axllent/mailpit:v1.27.4@sha256:df6c2541907e1be6fac21f509927cf6ed771617a1f4b361ef66d97bd05593d2d
    ports:
      - "127.0.0.1:${MAIL_PORT:-18025}:8025"
    environment:
      MP_MAX_MESSAGES: "200"
      MP_MAX_AGE: "24h"
    restart: unless-stopped
  app:
    environment:
      APP_PASSWORD_RESET_ENABLED: "true"
      APP_PASSWORD_RESET_BASE_URL: http://127.0.0.1:${APP_PORT:-18080}
      APP_PASSWORD_RESET_FROM: no-reply@stockroom.test
      SPRING_MAIL_HOST: mailpit
      SPRING_MAIL_PORT: "1025"
    depends_on:
      mailpit:
        condition: service_started
